<script>
const h=React.createElement;const{useState,useMemo}=React;

// Prototype/reference grade dataset. Values are retained from the supplied artifact.

const GRADES={

 '316L':{name:'316L (S31603)',type:'Austenitic',pren:25.0,yield:170,tensile:485,elong:40,minT:-196,maxT:870,weld:88,cost:1.30,form:90,deep:86,bend:90,source:'Atlas Steels / worldstainless reference set'},
 '321':{name:'321 (S32100)',type:'Stabilized Austenitic',pren:18.0,yield:205,tensile:515,elong:40,minT:-196,maxT:900,weld:85,cost:1.25,form:88,deep:84,bend:86,source:'Atlas Steels / worldstainless reference set'},
 '430':{name:'430 (S43000)',type:'Ferritic',pren:16.0,yield:205,tensile:450,elong:22,minT:-20,maxT:815,weld:70,cost:.85,form:72,deep:65,bend:70,source:'Atlas Steels / worldstainless reference set'},
 '2205':{name:'2205 Duplex (S32205)',type:'Duplex',pren:35.5,yield:450,tensile:620,elong:25,minT:-50,maxT:315,weld:65,cost:1.70,form:62,deep:55,bend:60,source:'ProjectMaterials / Langley Alloys reference set'},
 '2507':{name:'2507 Super Duplex (S32750)',type:'Super Duplex',pren:42.5,yield:550,tensile:795,elong:15,minT:-50,maxT:300,weld:55,cost:2.30,form:48,deep:42,bend:48,source:'ProjectMaterials / Langley Alloys reference set'}

const CHLORIDE={low:16,moderate:19,'mod-high':24,high:30,severe:40};
const ACID={none:0,mild:3,moderate:6,strong:10};
const TEMPBAND={cryogenic:{min:-196,max:-29,label:'Cryogenic (-196°C to -29°C)'},ambient:{min:-20,max:120,label:'Ambient (-20°C to 120°C)'},elevated:{min:120,max:350,label:'Elevated (120°C to 350°C)'},high:{min:350,max:600,label:'High (350°C to 600°C)'},veryhigh:{min:600,max:900,label:'Very High (600°C to 900°C)'}};
const YIELDBAND={standard:0,high:250,veryhigh:400};
const CRITERIA=[['corrosion','Corrosion Resistance'],['temp','Temperature Margin'],['yield','Yield Strength'],['weld','Weldability'],['cost','Lifecycle Cost']];
const APPS={
 chemical:{label:'Chemical Process Tank'},
 marine:{label:'Marine / Coastal Structure'},
 food:{label:'Food Processing Equipment'},
 solar:{label:'Solar / Renewable Structure'},
 rail:{label:'Railway / Transport Component'},

const EMPTY_INPUTS={app:'',chloride:'',acid:'',temp:'',yield:'',welding:'',ph:'',priority:50};

function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x));}
function normalize(arr){const s=arr.reduce((a,b)=>a+b,0)||1;return arr.map(x=>x/s);}
function geometricWeights(matrix){return normalize(matrix.map(r=>Math.pow(r.reduce((a,b)=>a*b,1),1/r.length)));}
function ahp(matrix){
 const w=geometricWeights(matrix),Aw=matrix.map(r=>r.reduce((a,v,i)=>a+v*w[i],0));
 const lambdas=Aw.map((v,i)=>v/(w[i]||1));const lambda=lambdas.reduce((a,b)=>a+b,0)/lambdas.length;
 const n=matrix.length,RI={1:0,2:0,3:.58,4:.90,5:1.12}[n]||1.12;const CI=n>1?(lambda-n)/(n-1):0;const CR=RI?CI/RI:0;

}
function pairValue(v){return v==='1'?1: v==='3'?3:v==='5'?5:v==='7'?7:v==='9'?9:v==='1/3'?1/3:v==='1/5'?1/5:v==='1/7'?1/7:v==='1/9'?1/9:1;}
function buildMatrix(pairs){const m=Array.from({length:5},()=>Array(5).fill(1));pairs.forEach((p,i)=>{const a=p.a,b=p.b,v=pairValue(p.v);m[a][b]=v;m[b][a]=1/v;});return m;}
function defaultPairs(priority){
 // Quick mode produces a transparent starting point for the advanced AHP panel.
 // It is then editable by the user. This is a convenience mapping, not a claim of expert judgment.
 const p=priority/100;
 const target=[.18+.34*p,.14,.18,.16,.36-.34*p];
 const pairs=[];for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){
   const ratio=target[i]/target[j];let v=ratio>=1?ratio:1/ratio;let options=[1,3,5,7,9];let best=options.reduce((x,o)=>Math.abs(o-v)<Math.abs(x-v)?o:x,1);pairs.push({a:i,b:j,v:ratio>=1?String(best):'1/'+best});
 }return pairs;
}
function tempScore(g,band){
 const low=band.min-g.minT, high=g.maxT-band.max;if(low<0||high<0)return 0;
 const lowMargin=clamp(50+low/2),highMargin=clamp(50+high/8);return clamp((lowMargin+highMargin)/2);
}
function evaluate(inputs,mode='quick',pairs=null){
 const reqPREN=CHLORIDE[inputs.chloride]+ACID[inputs.acid],band=TEMPBAND[inputs.temp],reqYield=YIELDBAND[inputs.yield];
 const results=[],rejected=[];
 Object.entries(GRADES).forEach(([key,g])=>{
  if(g.pren<reqPREN){rejected.push({key,g,reason:`Insufficient chloride/acid screening resistance (PREN ${g.pren} < required ${reqPREN})`});return;}
  if(!(g.minT<=band.min&&g.maxT>=band.max)){rejected.push({key,g,reason:`Not rated for the selected ${band.label} service range`});return;}
  if(g.yield<reqYield){rejected.push({key,g,reason:`Yield strength ${g.yield} MPa is below the selected ${inputs.yield} requirement`});return;}
  const corrosion=clamp(50+(g.pren-reqPREN)*3),cost=clamp(100-(g.cost-1)*40),mech=clamp(50+(g.yield-reqYield)*.15),weld=g.weld,temp=tempScore(g,band);
  const form=g.form;
  const scores={corrosion,temp,yield:mech,weld,cost};
  let final=0,detail={};
  if(mode==='advanced'){
    const matrix=buildMatrix(pairs);const A=ahp(matrix);const weights={corrosion:A.weights[0],temp:A.weights[1],yield:A.weights[2],weld:A.weights[3],cost:A.weights[4]};
    detail=weights;
    results.push({key,g,scores,reqPREN,over:(g.pren-reqPREN)>12,under:(g.pren-reqPREN)<3});
    return;
  }
  const p=inputs.priority/100;const weights={corrosion:.18+.34*p,temp:.14,yield:.18,weld:inputs.welding?.16:.10,cost:.36-.34*p};
  const total=Object.values(weights).reduce((a,b)=>a+b,0);Object.keys(weights).forEach(k=>weights[k]/=total);
  final=Object.keys(weights).reduce((s,k)=>s+weights[k]*scores[k],0);
  results.push({key,g,scores,score:final,weights,reqPREN,over:(g.pren-reqPREN)>12,under:(g.pren-reqPREN)<3});
 });
 if(mode==='advanced'){
   const matrix=buildMatrix(pairs),A=ahp(matrix),weights=A.weights;
   results.forEach(r=>r.ahpWeights=weights);
   const valid=results;
   const decision=valid.map(r=>[r.scores.corrosion,r.scores.temp,r.scores.yield,r.scores.weld,r.scores.cost]);
   const norm=[];for(let j=0;j<5;j++){const d=Math.sqrt(decision.reduce((s,row)=>s+row[j]*row[j],0))||1;norm.push(valid.map((_,i)=>decision[i][j]/d));}
   const weighted=valid.map((r,i)=>norm.map((col,j)=>col[i]*weights[j]));
   const idealBest=[],idealWorst=[];for(let j=0;j<5;j++){const vals=weighted.map(row=>row[j]);idealBest[j]=Math.max(...vals);idealWorst[j]=Math.min(...vals);}
   valid.forEach((r,i)=>{const dPlus=Math.sqrt(weighted[i].reduce((s,v,j)=>s+(v-idealBest[j])**2,0));const dMinus=Math.sqrt(weighted[i].reduce((s,v,j)=>s+(v-idealWorst[j])**2,0));r.score=dPlus+dMinus===0?1:dMinus/(dPlus+dMinus);r.topsis={dPlus,dMinus,weighted:weighted[i],norm:norm.map(c=>c[i]),idealBest,idealWorst};});
   valid.sort((a,b)=>b.score-a.score);return{top:valid.slice(0,3),rejected,reqPREN,band,weights,ahp:A,matrix};
 }
 results.sort((a,b)=>b.score-a.score);return{top:results.slice(0,3),rejected,reqPREN,band};
}
function Radar({items}){const axes=['Corrosion','Cost','Yield','Weldability','Temp'];const colors=['#22c55e','#60a5fa','#f97316'];const cx=150,cy=145,R=100;const angle=i=>-Math.PI/2+i*(2*Math.PI/5);const pt=(i,v)=>{const r=R*v/100;return[cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i))]};const rings=[20,40,60,80,100].map((v,k)=>h('polygon',{key:k,points:axes.map((_,i)=>pt(i,v).join(',')).join(' '),fill:'none',stroke:'var(--border)',strokeWidth:1}));const lines=axes.map((a,i)=>{const [x,y]=pt(i,100);return h('line',{key:i,x1:cx,y1:cy,x2:x,y2:y,stroke:'var(--border)'})});const labels=axes.map((a,i)=>{const [x,y]=pt(i,118);return h('text',{key:i,x,y,fontSize:9,fill:'var(--muted)',textAnchor:'middle'},a)});const polys=items.map((it,idx)=>{const m=[it.scores.corrosion,it.scores.cost,it.scores.yield,it.scores.weld,it.scores.temp];return h('polygon',{key:idx,points:m.map((v,i)=>pt(i,v).join(',')).join(' '),fill:colors[idx],fillOpacity:.16,stroke:colors[idx],strokeWidth:2})});return h('div',null,h('div',{className:'svgbox'},h('svg',{viewBox:'0 0 300 300',style:{width:'100%',maxWidth:350}},rings,lines,labels,polys)),h('div',{className:'legend'},items.map((it,i)=>h('span',{key:i},h('span',{className:'dot',style:{width:10,height:10,borderRadius:'50%',display:'inline-block',background:colors[i],marginRight:5}}),it.g.name))));}
function scoreBar(v){return h('div',{className:'meter'},h('span',{style:{width:clamp(v)+'%'}}));}
function SensitivityPanel({quickSensitivity,setTab}){
  const cards=quickSensitivity.map(x=>h('div',{className:'scenario',key:x.p},
    h('strong',null,x.p<40?'Cost-heavy':x.p>60?'Corrosion-heavy':'Balanced'),
    h('div',{className:'small muted'},'Priority dial: ',x.p),
    h('div',{style:{marginTop:8,fontWeight:900}},x.top),
    h('div',{className:'small muted'},'Quick score: ',Math.round(x.score),'/100')
  ));
  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'section-title'},h('h3',null,'What-if: Decision Priority Sensitivity'),h('span',{className:'badge'},'Quick mode diagnostic')),
      h('div',{className:'info'},'This diagnostic changes only the Cost ↔ Corrosion priority dial while keeping the other prototype weights fixed. It shows whether the top recommendation is sensitive to stakeholder priorities.'),
      h('div',{className:'whatif',style:{marginTop:12}},cards),
      h('div',{className:'notice'},'If the recommendation changes materially as priorities move, that is not a bug: it demonstrates that grade selection depends on the application owner’s trade-offs. Advanced AHP mode lets the user inspect and edit the full five-criterion priority structure.')
    ),

      h('h3',null,'Recommended demo sequence'),

        h('li',null,'Set service conditions and calculate.'),
        h('li',null,'Show hard-filter rejections.'),
        h('li',null,'Explain the top grade and over-specification alternative.'),
        h('li',null,'Open Advanced Engineering Mode.'),
        h('li',null,'Show AHP weights + CR < 0.10.'),
        h('li',null,'Show TOPSIS closeness and technical evidence.'),
        h('li',null,'Change a priority and demonstrate how the recommendation changes.')
      )
    ),
    h('div',{className:'row no-print'},h('button',{className:'btn ghost',onClick:()=>setTab('results')},'← Back to Recommendation'))
  );
}
function App(){
 const [inputs,setInputs]=useState({...EMPTY_INPUTS});
 const [app,setApp]=useState('');
 const [mode,setMode]=useState('quick');
 const [advancedOpen,setAdvancedOpen]=useState(false);
 const [pairs,setPairs]=useState(defaultPairs(65));
 const [result,setResult]=useState(null);
 const [dirty,setDirty]=useState(false);
 const [tab,setTab]=useState('results');
 const set=(k,v)=>{setInputs(x=>({...x,[k]:v}));if(result)setDirty(true)};
 const chooseApp=v=>{setApp(v);setInputs(x=>({...EMPTY_INPUTS,app:v,priority:x.priority??50}));setPairs(defaultPairs(50));setMode('quick');setAdvancedOpen(false);setResult(null);setDirty(false);setTab('results')};
 const isComplete=inputs.app!==''&&inputs.chloride!==''&&inputs.acid!==''&&inputs.temp!==''&&inputs.yield!==''&&inputs.welding!==''&&inputs.ph!==''&&Number.isFinite(Number(inputs.ph))&&Number(inputs.ph)>=0&&Number(inputs.ph)<=14;
 const calc=()=>{if(!isComplete)return;setResult(evaluate(inputs,mode,pairs));setDirty(false);setTab('results')};

 const quickSensitivity=useMemo(()=>isComplete?[20,50,80].map(p=>{const r=evaluate({...inputs,priority:p},'quick');return{p,top:r.top[0]?.g.name||'No fit',score:r.top[0]?.score||0}}):[],[inputs,isComplete]);
 const formOptions=[['low','Low'],['moderate','Moderate'],['high','High']];
 const inputCard=h('div',{className:'card'},[
  h('div',{className:'section-title',key:'title'},[h('h3',{key:'h'},'1. Application & Service Requirements'),h('span',{className:'badge',key:'b'},'Quick start')]),
  h('div',{className:'grid',key:'g1'},[
   h('div',{key:'app'},[h('label',null,'What are you designing?'),h('select',{value:app,onChange:e=>chooseApp(e.target.value)},[h('option',{key:'',value:''},'Select application / use case'),...Object.entries(APPS).map(([k,v])=>h('option',{key:k,value:k},v.label))]),h('div',{className:'small muted',style:{marginTop:6}},'Application is a label/template only; service conditions must be selected explicitly.')]),
   h('div',{key:'chloride'},[h('label',null,'Chloride Exposure'),h('select',{value:inputs.chloride,onChange:e=>set('chloride',e.target.value)},h('option',{value:''},'Select chloride exposure'),h('option',{value:'low'},'Low'),h('option',{value:'moderate'},'Moderate'),h('option',{value:'mod-high'},'Moderate–High'),h('option',{value:'high'},'High'),h('option',{value:'severe'},'Severe / Seawater'))]),
